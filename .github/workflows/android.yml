name: Android CI - Zentra 3D

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH
          gradle --version

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/zentra-debug.log

      - name: Build Release APK
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/zentra-release.log

      - name: Verify APK signatures
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSigner=$(find "$SDKROOT/build-tools" -name apksigner | head -1)
          echo "apksigner: $APKSigner"
          "$APKSigner" verify --print-certs app/build/outputs/apk/debug/*.apk
          "$APKSigner" verify --print-certs app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zentra-3d-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: zentra-3d-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zentra-build-logs
          path: /tmp/zentra-*.log
          if-no-files-found: ignore

      - name: Report errors on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ERRORS=$(grep -E "^e: |error:|FAILED|What went wrong" /tmp/zentra-debug.log /tmp/zentra-release.log 2>/dev/null | head -60)
          TAIL=$(tail -c 12000 /tmp/zentra-debug.log 2>/dev/null)
          {
            echo '### Falha no build Zentra 3D'
            echo ''
            echo '**Erros:**'
            echo '```'
            echo "$ERRORS"
            echo '```'
            echo ''
            echo '**Tail do log:**'
            echo '```'
            echo "$TAIL"
            echo '```'
          } > /tmp/comment.md
          head -c 20000 /tmp/comment.md > /tmp/comment-short.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/comment-short.md || true
